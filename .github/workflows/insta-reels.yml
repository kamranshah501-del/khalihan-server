name: Instagram reels for the app

# Our page's newest reels → Firestore config/reels (tools/insta_reels.py), every
# 3 hours. With the secret INSTAGRAM_TOKEN it uses Meta's API; without it, the
# page's public embed (a headless browser reads the newest 6 posts).
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Reel codes to add (comma-separated, newest first) — e.g. the first fill"
        required: false
        default: ""

jobs:
  reels:
    runs-on: ubuntu-latest
    if: ${{ vars.INSTA_REELS != 'off' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install firebase-admin==6.5.0 playwright==1.48.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/insta_reels.py
        env:
          PYTHONUNBUFFERED: "1"
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTA_SEED: ${{ github.event.inputs.seed }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
