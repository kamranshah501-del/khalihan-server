name: Admin alerts

# Khalihan Admin alerts — fallback only. Since 18 Nov 2026 the alerts run in
# Google Cloud (functions/alerts: at once for each new message, reply and test
# request, and every 10 minutes by Cloud Scheduler). GitHub's schedule for
# this never started, so this runs only by hand (Actions → Run workflow): the
# very same pass, functions/alerts/alerts_core.py. Prints counts only.

on:
  workflow_dispatch:

# One run at a time; a run that is still going is not cut short.
concurrency:
  group: admin-alerts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/admin_alerts.py
        env:
          PYTHONUNBUFFERED: "1"
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
