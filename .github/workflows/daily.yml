name: Khalihan daily prices

on:
  schedule:
    # All times UTC. India = UTC + 5:30.
    - cron: "30 0 * * *"   # 6:00 am  — prices + 6 am briefs
    - cron: "30 1 * * *"   # 7:00 am  — 7 am briefs only
    - cron: "30 2 * * *"   # 8:00 am  — 8 am briefs only
    - cron: "30 5 * * *"   # 11:00 am — refresh only
    - cron: "30 9 * * *"   # 3:00 pm  — refresh only
    - cron: "0 14 * * *"   # 7:30 pm  — evening alerts push
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh (data only), morning (data + 6 am brief), brief7, brief8, evening (alerts)"
        required: true
        default: refresh
        type: choice
        options: [refresh, morning, brief7, brief8, evening]

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only to push status.json to the "status" branch (see the last step).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip   # keep downloads between runs
      - run: pip install -r requirements.txt
      - run: python daily_prices.py
        env:
          # Print each line the moment it happens, so a running job's log isn't empty.
          PYTHONUNBUFFERED: "1"
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          STATES: ${{ vars.STATES }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '30 0 * * *' && 'morning') || (github.event.schedule == '30 1 * * *' && 'brief7') || (github.event.schedule == '30 2 * * *' && 'brief8') || (github.event.schedule == '0 14 * * *' && 'evening') || 'refresh' }}

      # How the run went, per state (sources, rows, scrubbed errors — never a
      # key): one file on its own branch, replaced each run, so it can be read
      # without opening the Actions log. Never blocks the prices.
      - name: Share the run's status
        if: always()
        continue-on-error: true
        run: |
          [ -f status.json ] || exit 0
          mkdir -p /tmp/status && cp status.json /tmp/status/
          cd /tmp/status
          git init -q -b status
          git add status.json
          git -c user.name="khalihan-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Daily job status $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status
