name: Khalihan daily prices

on:
  schedule:
    # All times UTC. India = UTC + 5:30.
    - cron: "30 0 * * *"   # 6:00 am  — prices + 6 am briefs
    - cron: "30 1 * * *"   # 7:00 am  — 7 am briefs only
    - cron: "30 2 * * *"   # 8:00 am  — 8 am briefs only
    - cron: "30 5 * * *"   # 11:00 am — refresh only
    - cron: "30 9 * * *"   # 3:00 pm  — refresh only
    - cron: "0 14 * * *"   # 7:30 pm  — evening alerts push
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh (data only), morning (data + 6 am brief), brief7, brief8, evening (alerts)"
        required: true
        default: refresh
        type: choice
        options: [refresh, morning, brief7, brief8, evening]

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip   # keep downloads between runs
      - run: pip install -r requirements.txt
      - run: python daily_prices.py
        env:
          # Print each line the moment it happens, so a running job's log isn't empty.
          PYTHONUNBUFFERED: "1"
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          STATES: ${{ vars.STATES }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '30 0 * * *' && 'morning') || (github.event.schedule == '30 1 * * *' && 'brief7') || (github.event.schedule == '30 2 * * *' && 'brief8') || (github.event.schedule == '0 14 * * *' && 'evening') || 'refresh' }}
