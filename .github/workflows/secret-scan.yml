name: Leak check (keys and phone numbers)

# This repository is public. On every push, tools/secret_scan.py looks for
# keys, tokens and phone numbers and shows a warning on the run's page — the
# value itself is never printed, and a push is never stopped (owner, 27 Nov
# 2026). "Run workflow" by hand with history on checks every commit ever made.
on:
  push:
  workflow_dispatch:
    inputs:
      history:
        description: "Check every line ever committed, not only the files as they are"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && inputs.history && '0' || '1' }}
      - run: python3 tools/secret_scan.py --selftest
      - run: python3 tools/secret_scan.py ${{ github.event_name == 'workflow_dispatch' && inputs.history && '--history' || '' }}
