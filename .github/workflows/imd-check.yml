name: IMD warnings check

# Tests the IMD reader and shows what IMD says for Maharashtra right now.
# "[imdpush]" in the commit message also sends the fake hail to topic wx_test
# (test-build phones that opted in on Profile → चेतावनी की जाँच);
# "[wxreport]" prints the Open-Meteo vs Google score so far.
on:
  push:
    branches: [imd-warnings, main]
    paths: ["functions/alerts/**", "tools/imd_warnings.py", "tools/test_imd.py", "tools/wx_compare_report.py", "tools/fixtures/imd/**", ".github/workflows/imd-check.yml"]
  workflow_dispatch:
    inputs:
      report:
        description: "Print the Open-Meteo vs Google weather score"
        type: boolean
        default: true
      test_push:
        description: "Send the fake IMD hail to topic wx_test"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/test_imd.py
      - name: What IMD says now
        run: python tools/imd_warnings.py
      - name: Test push to wx_test
        if: contains(github.event.head_commit.message, '[imdpush]') || inputs.test_push
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          pip install firebase-admin==6.5.0
          python tools/imd_warnings.py --test-push
      - name: Weather comparison score (Open-Meteo vs Google vs IMD observed)
        if: contains(github.event.head_commit.message, '[wxreport]') || inputs.report
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          pip install firebase-admin==6.5.0
          python tools/wx_compare_report.py
