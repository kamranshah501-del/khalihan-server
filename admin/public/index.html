<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Khalihan Admin</title>
<!-- Installable as an app on the computer (Chrome / Edge: "Install"; Mac Safari: File → Add to Dock). -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#20405E">
<meta name="application-name" content="Khalihan Admin">
<meta name="apple-mobile-web-app-title" content="Khalihan Admin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  // Chrome / Edge say "this can be installed" once — keep it for the
  // panel's own Install button (app.js), which may load a moment later.
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.khalihanInstall = e;
    window.dispatchEvent(new Event('khalihan-installable'));
  });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button id="menu" class="iconbtn" aria-label="Menu" aria-expanded="false" aria-controls="tabs" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="brand">
    <span class="logo" id="logo" aria-hidden="true"></span>
    <span class="name">Khalihan Admin</span>
  </div>
  <form class="search" id="search" role="search" hidden>
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false" aria-label="Search">
    <kbd aria-hidden="true">/</kbd>
    <div class="results" id="results" hidden></div>
  </form>
  <div class="tright">
    <span class="livebadge" id="livebadge" hidden><i></i><span id="livetext">Live</span></span>
    <button id="install" class="ghost small" hidden>💻 Install</button>
    <button id="langbtn" class="ghost small" hidden>हिं</button>
    <div class="me">
      <button class="av" id="avatar" type="button" aria-haspopup="true" aria-expanded="false" hidden>•</button>
      <div class="memenu" id="memenu" hidden>
        <div class="who" id="who"></div>
        <button id="logout" class="plain" hidden>Log out</button>
      </div>
    </div>
  </div>
</header>

<div class="shell">
  <nav id="tabs" class="sidenav" hidden></nav>
  <main id="main">
    <section class="center">
      <p class="muted">Loading…</p>
    </section>
  </main>
</div>
<div id="navscrim" class="navscrim" hidden></div>

<div id="toast" class="toast" hidden></div>
<!-- Optional keys (reCAPTCHA for App Check). Safe to be public. -->
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
